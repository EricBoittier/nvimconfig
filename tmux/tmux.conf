# tmux.conf — tuned for kitty + neovim. Linked to ~/.config/tmux/tmux.conf.
# No plugin manager needed; everything is built in or lives in this repo.
#
# Prefix: Ctrl-Space (Ctrl-b also works).  Reload: prefix r
# Ctrl-h/j/k/l  move between tmux panes AND nvim splits (smart-splits.nvim)
# Alt-h/j/k/l   resize, same seamless rules

# ---- terminal: true colour, undercurl, kitty keys, images ----------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys:usstyle:hyperlinks:clipboard"
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on              # Ctrl-Enter, Shift-Tab etc. reach nvim intact
set -g allow-passthrough on          # kitty graphics/images from inside tmux
set -g set-clipboard on              # yank anywhere -> system clipboard (OSC 52; works over ssh)
set -g focus-events on               # nvim autoread / gitsigns refresh on focus
set -sg escape-time 0                # no Esc lag in nvim
set -g set-titles on
set -g set-titles-string "#S · #W"

# ---- behaviour ------------------------------------------------------------------
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off         # closing a session jumps to another instead of exiting
setw -g aggressive-resize on
set -g display-time 1500
set -g repeat-time 400

# ---- keys -----------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# splits and new windows keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane                     # no confirm
bind Tab last-window
bind -r H previous-window
bind -r L next-window
bind z resize-pane -Z                # zoom (built in; kept here as a reminder)

# Ctrl-l is taken by navigation, so clear the screen with prefix Ctrl-l
bind C-l send-keys C-l

# popups: sessionizer, lazygit, scratch shell, btop
bind f display-popup -E -w 70% -h 60% "~/.config/nvim/tmux/tm"
bind s display-popup -E -w 70% -h 60% "~/.config/nvim/tmux/tm --sessions"
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "command -v lazygit >/dev/null && lazygit || { echo 'brew install lazygit'; read -n1; }"
bind ` display-popup -E -w 80% -h 70% -d "#{pane_current_path}"
bind b display-popup -E -w 90% -h 90% "command -v btop >/dev/null && btop || top"

# ---- seamless nvim <-> tmux navigation (pairs with smart-splits.nvim) -----------
# smart-splits sets @pane-is-vim on panes running nvim; there the keys go to nvim,
# which moves between its own splits and hands off to tmux at the edge.
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "if -F '#{pane_at_left}'   '' 'select-pane -L'"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "if -F '#{pane_at_top}'    '' 'select-pane -U'"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "if -F '#{pane_at_right}'  '' 'select-pane -R'"
bind -n M-h if -F "#{@pane-is-vim}" "send-keys M-h" "resize-pane -L 3"
bind -n M-j if -F "#{@pane-is-vim}" "send-keys M-j" "resize-pane -D 3"
bind -n M-k if -F "#{@pane-is-vim}" "send-keys M-k" "resize-pane -U 3"
bind -n M-l if -F "#{@pane-is-vim}" "send-keys M-l" "resize-pane -R 3"
bind -T copy-mode-vi C-h if -F "#{pane_at_left}"   "" "select-pane -L"
bind -T copy-mode-vi C-j if -F "#{pane_at_bottom}" "" "select-pane -D"
bind -T copy-mode-vi C-k if -F "#{pane_at_top}"    "" "select-pane -U"
bind -T copy-mode-vi C-l if -F "#{pane_at_right}"  "" "select-pane -R"

# ---- copy mode: vim keys --------------------------------------------------------
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# ---- look: Catppuccin Macchiato, transparent so kitty's wallpaper shows ----------
# palette: base #24273a  surface0 #363a4f  overlay0 #6e738d  text #cad3f5
#          mauve #c6a0f6 sky #91d7e3 green #a6da95 peach #f5a97f red #ed8796
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#cad3f5"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#24273a,bg=#c6a0f6,bold] #{?client_prefix,󰠠 ,} #S #[bg=default] "
set -g status-right "#{?window_zoomed_flag,#[fg=#f5a97f]󰊓 zoom  ,}#[fg=#6e738d]#{b:pane_current_path}  #[fg=#91d7e3]%H:%M #[fg=#6e738d]%d %b "
setw -g window-status-format "#[fg=#6e738d] #I #W "
setw -g window-status-current-format "#[fg=#24273a,bg=#91d7e3,bold] #I #W #[bg=default]"
setw -g window-status-separator ""
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#c6a0f6"
set -g pane-border-lines heavy
set -g popup-border-style "fg=#c6a0f6"
set -g popup-border-lines rounded
set -g message-style "bg=#363a4f,fg=#cad3f5"
setw -g mode-style "bg=#494d64,fg=#cad3f5"
setw -g clock-mode-colour "#c6a0f6"

# machine-local overrides (not in git)
source-file -q ~/.config/tmux/local.conf
