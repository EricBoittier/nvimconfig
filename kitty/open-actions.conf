# Actions for clicked links in kitty (first matching rule wins).
# Docs: https://sw.kovidgoyal.net/kitty/open_actions/

# Web links -> Chrome
protocol http,https
action launch --type=background open -a "Google Chrome" ${URL}

# Local files Chrome renders well -> Chrome
protocol file
ext html,htm,pdf,svg,png,jpg,jpeg,gif,webp,json,xml
action launch --type=background open -a "Google Chrome" ${FILE_PATH}

# Directories -> Finder
protocol file
mime inode/directory
action launch --type=background open ${FILE_PATH}

# Any other local file -> its default macOS app
protocol file
action launch --type=background open ${FILE_PATH}
